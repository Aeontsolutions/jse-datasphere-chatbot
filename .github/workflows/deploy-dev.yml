name: Deploy to dev

# Trunk-based development: every merge to main lands on dev immediately, with
# no approval, so the team can keep merging. Prod is a separate pipeline
# triggered by a release tag -- see .github/workflows/release-prod.yml and
# docs/adr/0004-trunk-based-development.md.
#
# The eval gate stays here as a fast regression tripwire: it catches a bad
# merge on the day it lands rather than at release time a week later.
#
# One-time setup required before this workflow can run -- see
# docs/CI_CD_DEPLOY_PIPELINE.md for exact commands:
#   - An IAM role for GitHub OIDC (repo variable AWS_DEPLOY_ROLE_ARN)
#   - Secrets: COPILOT_API_MANIFEST, COPILOT_DEV_ENV_MANIFEST, GEMINI_API_KEY
#   - A seeded baseline at evals/baselines/dev.json

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  COPILOT_APP: jse-datasphere-chatbot
  COPILOT_SVC: api
  COPILOT_VERSION: v1.34.1

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS Copilot CLI
        run: |
          # Kept identical to release-prod.yml's install.
          # -f: a bad COPILOT_VERSION would otherwise silently write GitHub's
          # HTML 404 page to the binary path; chmod +x would still succeed,
          # and it would only fail later as a confusing exec error.
          curl -sSLf --max-time 30 -o /usr/local/bin/copilot "https://github.com/aws/copilot-cli/releases/download/${{ env.COPILOT_VERSION }}/copilot-linux"
          chmod +x /usr/local/bin/copilot
          copilot --version

      # api/manifest.yml and environments/dev/manifest.yml are gitignored
      # (docs/SECRETS_MANAGEMENT.md) -- a fresh checkout never has them, so
      # they're supplied here from repo secrets instead of the working tree.
      - name: Write gitignored Copilot manifests
        run: |
          mkdir -p fastapi_app/copilot/api fastapi_app/copilot/environments/dev
          cat > fastapi_app/copilot/api/manifest.yml <<'COPILOT_API_MANIFEST_EOF'
          ${{ secrets.COPILOT_API_MANIFEST }}
          COPILOT_API_MANIFEST_EOF
          cat > fastapi_app/copilot/environments/dev/manifest.yml <<'COPILOT_DEV_ENV_MANIFEST_EOF'
          ${{ secrets.COPILOT_DEV_ENV_MANIFEST }}
          COPILOT_DEV_ENV_MANIFEST_EOF

      # .dockerignore excludes .git/, so the container cannot derive its own
      # commit. Write it into the build context instead -- the Dockerfile's
      # COPY . . bakes it in, and GET /version reads it back. The release
      # pipeline uses that to prove dev is serving a given commit.
      - name: Stamp build commit
        run: echo "${{ github.sha }}" > fastapi_app/app/BUILD_SHA

      - name: copilot svc deploy --env dev
        working-directory: fastapi_app
        run: copilot svc deploy --name "${{ env.COPILOT_SVC }}" --env dev

      # Computed inline (not passed as a job output) -- GitHub Actions silently
      # empties any job output whose value contains a substring matching a
      # registered secret, which this URL tripped on in practice. eval-gate
      # below computes the same value itself instead of reading it from here.
      - name: Wait for dev /health
        run: |
          BASE_URL="${{ vars.DEV_BASE_URL || 'http://jse-da-Publi-3w4oxbvTf5j0-374994583.us-east-1.elb.amazonaws.com' }}"
          for i in $(seq 1 20); do
            if curl -fsS "$BASE_URL/health"; then exit 0; fi
            sleep 15
          done
          echo "::error::dev /health did not turn healthy in time"
          exit 1

  eval-gate:
    name: Eval suite regression gate (dev)
    runs-on: ubuntu-latest
    needs: deploy-dev
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install eval suite
        run: |
          cd evals
          python -m pip install --upgrade pip
          pip install -e .
          # python-dotenv: a dependency of scripts/run_eval.py, not of the
          # evals package itself -- present on dev machines via fastapi_app's
          # own install, absent on a clean CI runner.
          pip install python-dotenv

      - name: Run eval suite against dev
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/run_eval.py \
            --base-url "${{ vars.DEV_BASE_URL || 'http://jse-da-Publi-3w4oxbvTf5j0-374994583.us-east-1.elb.amazonaws.com' }}" \
            --replicates 1 \
            --concurrency 3 \
            --max-cost-usd 5 \
            --run-id "ci-${{ github.run_id }}"

      # Reads by_category.positive (not `overall`, which is dragged down by
      # by-design-passing refusal personas) and fails the job on regression
      # vs evals/baselines/dev.json. See scripts/check_eval_gate.py.
      - name: Check regression gate
        run: python scripts/check_eval_gate.py "evals/runs/ci-${{ github.run_id }}"

      - name: Upload eval run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-run-ci-${{ github.run_id }}
          path: evals/runs/ci-${{ github.run_id }}
          retention-days: 30
