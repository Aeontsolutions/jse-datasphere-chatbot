name: App Deploy (FastAPI)

on:
  pull_request:
    paths:
      - 'fastapi_app/**'
      - '.github/workflows/app.yml'
  push:
    branches:
      - main
    paths:
      - 'fastapi_app/**'
      - '.github/workflows/app.yml'

env:
  AWS_REGION: us-east-1

permissions:
  contents: read
  pull-requests: write

jobs:
  # ── PR: run tests ───────────────────────────────────────────────────────────
  test:
    name: Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd fastapi_app
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          cd fastapi_app
          pytest tests/unit/ -v --tb=short

  # ── Merge: build and push image ─────────────────────────────────────────────
  build:
    name: Build & Push Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      ecr_url: ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}

    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          IMAGE: ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          docker build -t "$IMAGE" ./fastapi_app
          docker push "$IMAGE"
          # Also tag as latest for Terraform default
          docker tag "$IMAGE" \
            ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest
          docker push \
            ${{ steps.login.outputs.registry }}/${{ vars.ECR_REPOSITORY_NAME }}:latest

  # ── Deploy to staging ───────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    needs: build
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition
        env:
          IMAGE: ${{ needs.build.outputs.ecr_url }}:${{ needs.build.outputs.image_tag }}
          CLUSTER: jse-datasphere-staging
          SERVICE: api
          FAMILY: jse-datasphere-staging-api
        run: |
          # Fetch current task definition, update image, register new revision
          CURRENT=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition')
          NEW_TASKDEF=$(echo "$CURRENT" | jq \
            --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASKDEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text

      - name: Rolling deploy
        env:
          CLUSTER: jse-datasphere-staging
          SERVICE: api
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"

  # ── Smoke test ──────────────────────────────────────────────────────────────
  smoke-test-staging:
    name: Smoke test — Staging
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Health + endpoints check
        run: |
          BASE="${{ vars.STAGING_API_URL }}"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/health")
            [ "$STATUS" = "200" ] && echo "Health OK" && exit 0
            echo "Attempt $i: got $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Smoke test failed"
          exit 1

  # ── Deploy to prod ──────────────────────────────────────────────────────────
  deploy-prod:
    name: Deploy → Prod
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.TF_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.TF_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update ECS task definition
        env:
          IMAGE: ${{ needs.build.outputs.ecr_url }}:${{ needs.build.outputs.image_tag }}
          FAMILY: jse-datasphere-prod-api
        run: |
          CURRENT=$(aws ecs describe-task-definition --task-definition "$FAMILY" --query 'taskDefinition')
          NEW_TASKDEF=$(echo "$CURRENT" | jq \
            --arg IMAGE "$IMAGE" \
            '.containerDefinitions[0].image = $IMAGE |
             del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                 .compatibilities, .registeredAt, .registeredBy)')
          aws ecs register-task-definition \
            --cli-input-json "$NEW_TASKDEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text

      - name: Rolling deploy
        env:
          CLUSTER: jse-datasphere-prod
          SERVICE: api
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --force-new-deployment

          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE"
