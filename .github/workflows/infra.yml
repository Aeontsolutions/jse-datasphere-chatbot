name: Infrastructure (Terraform)

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'

env:
  TF_VERSION: "~1.9"
  TF_WORKING_DIR: terraform
  AWS_REGION: us-east-1

permissions:
  contents: read
  pull-requests: write
  id-token: write   # required for OIDC

jobs:
  # ── PR: show plan for all environments ─────────────────────────────────────
  plan:
    name: Plan (${{ matrix.environment }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [staging, prod]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - name: terraform plan
        id: plan
        run: |
          terraform plan -no-color \
            -var-file=environments/${{ matrix.environment }}.tfvars \
            2>&1 | tee plan_output.txt
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(0, 60000) + '\n...(truncated)' : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform Plan — \`${{ matrix.environment }}\`\n\`\`\`terraform\n${truncated}\n\`\`\``
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Merge: deploy staging ───────────────────────────────────────────────────
  deploy-staging:
    name: Deploy → Staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve -var-file=environments/staging.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}

  # ── Smoke test staging ──────────────────────────────────────────────────────
  smoke-test-staging:
    name: Smoke test — Staging
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Health check
        run: |
          URL="${{ vars.STAGING_API_URL }}/health"
          echo "Checking $URL"
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            [ "$STATUS" = "200" ] && echo "OK" && exit 0
            echo "Attempt $i: got $STATUS, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 5 attempts"
          exit 1

  # ── Deploy prod (requires manual approval via GitHub environment gate) ───────
  deploy-prod:
    name: Deploy → Prod
    needs: smoke-test-staging
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - run: terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}

      - run: terraform apply -auto-approve -var-file=environments/prod.tfvars
        working-directory: ${{ env.TF_WORKING_DIR }}
